<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#76AE43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saftpresse">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Saftpresse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap">
<style>
/* Layout: Juuzo-Anlehnung. Grüne Titelleiste, graue Listenzeilen mit grüner Unterkante, Farbrad rechts, Tab-Leiste unten mit orangem Aktiv-Zustand. Detailseiten als gestapelte Vollbild-Seiten. */
:root{
  --bar:#76AE43; --bar-ink:#FFFFFF; --bg:#F1F1EE; --row:#E7E7E3; --surface:#FFFFFF;
  --ink:#3B3E39; --muted:#777B73; --line:#76AE43; --accent:#E9852B; --wood:#2F2823; --wood-ink:#F3EFE8;
  --c-green:#7DB343; --c-orange:#EE8A2A; --c-red:#D8433B; --c-yellow:#F0C02F; --c-white:#EFEBDD;
  --font:"Source Sans 3","Source Sans Pro",-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bar:#4F7E2C; --bg:#131512; --row:#1E211C; --surface:#252922; --ink:#E5E8E1; --muted:#9DA296; --line:#4F7E2C;
  --accent:#F29B47; --wood:#1B1613; --c-white:#D9D4C4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bar:#4F7E2C; --bg:#131512; --row:#1E211C; --surface:#252922; --ink:#E5E8E1; --muted:#9DA296; --line:#4F7E2C;
  --accent:#F29B47; --wood:#1B1613; --c-white:#D9D4C4; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bar)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto}

/* Titelleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);color:var(--bar-ink)}
.bar .wrap{display:grid;grid-template-columns:90px 1fr 90px;align-items:center;min-height:48px}
.bar h1{margin:0;text-align:center;font-size:1.1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--bar-ink)}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4}
.logo{font-weight:900;font-size:1.35rem;letter-spacing:-.02em;text-align:center}
.logo span{color:#FFD9A8}

/* Unterreiter */
.subtabs{background:var(--row);display:grid;grid-template-columns:repeat(3,1fr)}
.subtabs button{padding:12px 4px;font-size:.82rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 2px 6px;font-weight:700}
.section-head small{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Rezeptzeile */
.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:84px 1fr 56px;gap:12px;align-items:center;background:var(--row);border-bottom:3px solid var(--line);text-align:left;width:100%;min-height:84px;padding-right:12px}
.row .thumb{align-self:stretch}
.row .t{min-width:0;padding-block:8px}
.row .name{font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:.98rem}
.row .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;text-transform:uppercase;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.row .extra{font-size:.8rem;color:var(--accent);margin-top:2px}
.heart{color:var(--c-red)}
.thumb{background:var(--wood);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.thumb .bits{position:absolute;left:6px;bottom:6px;display:flex;gap:3px}
.thumb .bits{gap:0}.thumb .bits svg{margin-right:-5px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}

/* Sammlungen / einfache Listen */
.plain{display:flex;flex-direction:column;gap:4px}
.plain button,.plain .li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--row);border-bottom:3px solid var(--line);padding:13px 14px;text-align:left;width:100%}
.plain .n{font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:.92rem}
.plain .c{font-size:.74rem;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.plain .desc{display:block;font-weight:400;text-transform:none;letter-spacing:0;font-size:.84rem;color:var(--muted);margin-top:2px}
.tag{border:1.2px solid var(--muted);border-radius:99px;padding:0 7px;font-size:.66rem;letter-spacing:.04em}
.switch{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border-bottom:3px solid var(--line);padding:12px 14px;margin-top:10px}
.switch .knob{width:42px;height:24px;border-radius:99px;background:var(--row);border:1.5px solid var(--muted);position:relative;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-pressed="true"] .knob{background:var(--bar);border-color:var(--bar)}
.switch[aria-pressed="true"] .knob::after{transform:translateX(18px);background:#fff}
.switch .desc{display:block;font-size:.8rem;color:var(--muted)}
.linkbtn{color:var(--accent);font-weight:700;text-decoration:underline}
.ev{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:2px 8px;white-space:nowrap;border:1.5px solid currentColor}
.ev.a{color:var(--c-green)} .ev.b{color:var(--accent)} .ev.c{color:var(--muted)}

/* Start */
.hero{background:var(--wood);color:var(--wood-ink);padding:22px 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero h2{margin:0;color:#9FD06A;font-weight:900;text-transform:uppercase;font-size:1.45rem;line-height:1.1;text-wrap:balance}
.hero p{margin:6px 0 0;font-size:.95rem;opacity:.9}
.band{background:var(--bar);color:var(--bar-ink);padding:8px 12px;font-weight:700;font-size:.9rem}
.cards{display:flex;flex-direction:column;gap:6px;padding-block:6px}
.card{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;background:var(--surface);border-bottom:3px solid var(--line);padding:14px 12px;text-align:left;width:100%}
.card .ic{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.82rem;color:var(--muted)}
.card svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Mixer */
.mixer{background:var(--bar);padding:16px 12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.kettle{width:min(300px,82vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3a312b,var(--wood) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;position:relative}
.kettle .in{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-height:60%;overflow:auto}
.kettle .hint{color:var(--wood-ink);opacity:.7;text-align:center;font-size:.9rem;max-width:200px}
.pillbtn{border:1.5px solid var(--accent);color:var(--accent);border-radius:99px;padding:7px 16px;font-weight:700;background:transparent}
.pillbtn[disabled]{opacity:.45;cursor:default}
.clearx{position:absolute;right:max(14px,calc(50% - 170px));bottom:22px;width:40px;height:40px;border-radius:50%;background:var(--wood);color:var(--c-red);display:flex;align-items:center;justify-content:center}
.clearx svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none}
.modes{display:flex;gap:6px;background:rgba(0,0,0,.15);border-radius:99px;padding:3px}
.modes button{font-size:.78rem;font-weight:700;color:var(--bar-ink);padding:6px 12px;border-radius:99px}
.modes button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.shelf{background:var(--wood);color:var(--wood-ink)}
.shelf .rowx{display:grid;grid-template-columns:78px 1fr;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.shelf .rowx > .label{color:var(--wood-ink);opacity:.6;text-align:center;padding:6px}
.scroller{display:flex;gap:10px;overflow-x:auto;padding:12px 12px 10px 4px;min-width:0;scrollbar-width:thin}
.bub{display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;flex:none;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em;text-align:center;color:var(--wood-ink)}
.bub .o{width:54px;height:54px;border-radius:50%;border:4px solid;display:flex;align-items:center;justify-content:center;background:#fff;position:relative}
.bub[aria-pressed="true"] .o::after{content:"✓";position:absolute;right:-4px;top:-4px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:.75rem;display:flex;align-items:center;justify-content:center}
.bub.sm{width:56px}.bub.sm .o{width:44px;height:44px;border-width:3px}

/* Detail */
.dhero{background:var(--wood);display:flex;justify-content:center;align-items:flex-end;padding-top:18px;position:relative;min-height:220px}
.dhero .bits{position:absolute;inset:auto 16px 16px auto;display:flex;gap:6px}
.dhero .bits .ico{width:50px;height:50px;border-radius:50%;background:#FBF8F1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.dband{background:var(--bar);color:var(--bar-ink);padding:16px 16px 18px}
.dband h2{margin:0;font-weight:900;text-transform:uppercase;font-size:1.3rem;letter-spacing:.02em}
.dband .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.76rem;text-transform:uppercase;margin-top:6px;opacity:.95;font-variant-numeric:tabular-nums}
.dband p{margin:10px 0 0;font-size:1rem}
.dband .acts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.ghost{border:1.5px solid var(--bar-ink);color:var(--bar-ink);border-radius:99px;padding:6px 16px;font-size:.82rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.ghost[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.ghost svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.ghost[aria-pressed="true"] svg.h{fill:currentColor}
.block{background:var(--surface);padding:16px;border-bottom:3px solid var(--line)}
.block h3{margin:0 0 10px;font-size:1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ingwrap{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.pills{display:flex;flex-direction:column;gap:6px;min-width:0}
.ipill{border-radius:99px;padding:5px 12px;color:#fff;font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;gap:10px}
.ipill.light{color:#3B3E39}
.ipill{align-items:center;padding:4px 12px 4px 4px}.pn{display:flex;align-items:center;gap:8px;min-width:0}.pic{width:28px;height:28px;border-radius:50%;background:#FBF8F1;display:flex;align-items:center;justify-content:center;flex:none}
.ipill .g{font-variant-numeric:tabular-nums;font-weight:600;opacity:.95;white-space:nowrap}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:99px}
.stepper button{width:30px;height:28px;font-size:1.05rem;color:var(--accent);font-weight:700}
.stepper span{min-width:62px;text-align:center;font-size:.8rem;font-weight:700;text-transform:uppercase;font-variant-numeric:tabular-nums}
.tips{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.tips b{font-weight:700}
ol.steps{margin:0;padding-left:20px}
ol.steps li{margin-bottom:8px}
.note{font-size:.86rem;color:var(--muted);border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:10px 0 0}
.btn{background:var(--accent);color:#fff;border-radius:99px;padding:10px 18px;font-weight:700}
.btn2{border:1.5px solid var(--accent);color:var(--accent);border-radius:99px;padding:9px 16px;font-weight:700}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* Wissen */
details.z{background:var(--row);border-bottom:3px solid var(--line)}
details.z summary{list-style:none;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:8px 12px;cursor:pointer}
details.z summary::-webkit-details-marker{display:none}
details.z .zn{font-weight:700;text-transform:uppercase;font-size:.92rem}
details.z .zs{font-size:.76rem;color:var(--muted)}
details.z .zb{padding:0 14px 14px 72px;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
details.z .zb b{font-weight:700}

/* Programme / Verlauf */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--surface);border-bottom:3px solid var(--line);padding:12px;text-align:center}
.stat b{display:block;font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--bar)}
.stat span{font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.week div{background:var(--surface);text-align:center;padding:8px 0 6px;font-size:.7rem;color:var(--muted);text-transform:uppercase}
.week div i{display:block;height:6px;border-radius:3px;margin:6px 8px 0;background:var(--row)}
.week div.on i{background:var(--c-green)}
.week div.today{outline:1.5px solid var(--accent)}

.empty{background:var(--surface);border:1.5px dashed var(--line);padding:20px;color:var(--muted);text-align:center}

/* Tab-Leiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--row);border-top:1px solid rgba(0,0,0,.08);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem;color:var(--muted);text-decoration:none;padding:4px 0}
nav.tabs a[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.9rem;z-index:50;white-space:nowrap}
.foot{font-size:.8rem;color:var(--muted);padding:14px 4px}
</style>
</head>
<body>

<header class="bar"><div class="wrap gut">
  <div id="backSlot"></div><h1 id="title"></h1><div></div>
</div></header>
<main id="main"></main>

<script>
// ===================== Daten =====================

 karotte:{n:"Karotte",pl:"Karotten",cat:"gem",grp:"or",y:50,kc:40,p:80,c:"#F2861E",s:1.6,

function juiceColor(r){
  let w=0,rr=0,gg=0,bb=0;
  for(const [k,g] of Object.entries(r.z)){ const h=Z[k].c, x=mlOf(k,g)*Z[k].s; w+=x;
    rr+=parseInt(h.slice(1,3),16)*x; gg+=parseInt(h.slice(3,5),16)*x; bb+=parseInt(h.slice(5,7),16)*x; }
  return `rgb(${Math.round(rr/w*.92)},${Math.round(gg/w*.92)},${Math.round(bb/w*.92)})`;
}

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function jar(color,h){ const w=Math.round(h*.7);
  return `<svg width="${w}" height="${h}" viewBox="0 0 35 50" aria-hidden="true">
   <rect x="6" y="3" width="23" height="5" rx="1.5" fill="#cfc8bd" opacity=".55"/>
   <path d="M5 9h25v36a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="${color}"/>
   <path d="M5 9h25v4H5z" fill="#fff" opacity=".18"/>
   <path d="M5 9h25v36a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.2"/>
   <path d="M9 14v26" stroke="#fff" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/></svg>`; }
function wheel(r,size=52){
  const parts=wheelParts(r), R0=15.5, C=2*Math.PI*R0; let off=0, segs="";
  for(const g of ["gr","ye","or","rd","wh"]){ const p=parts[g]; if(!p) continue; const len=p*C;
    segs+=`<circle cx="21" cy="21" r="${R0}" fill="none" stroke="${GRPHEX[g]}" stroke-width="8" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"/>`; off+=len; }
  return `<svg width="${size}" height="${size}" viewBox="0 0 42 42" role="img" aria-label="Farbrad der Zutaten">${segs}<circle cx="21" cy="21" r="11.5" fill="none" stroke="rgba(0,0,0,.08)" stroke-width=".6"/></svg>`;
}
function thumb(r,h=74){ const ks=Object.keys(r.z).sort((a,b)=>r.z[b]-r.z[a]).slice(0,3);
  return `<span class="thumb">${jar(juiceColor(r),h-14)}<span class="bits">${ks.map(k=>icon(k,22)).join("")}</span></span>`; }
function row(r,extra=""){
  const n=Object.keys(r.z).length;
  return `<button class="row" data-open="${r.id}">${thumb(r)}
   <span class="t"><span class="name">${esc(r.n)}${favs.has(r.id)?' <span class="heart">♥</span>':''}</span>
   <span class="meta"><span>${n} ${n===1?"Zutat":"Zutaten"}</span><span>~${kcal(r)} kcal</span><span>${vegShare(r)} % Gemüse</span>${r.w?`<span class="tag">Walker</span>`:""}${r.b?`<span class="tag">Rezeptbuch</span>`:""}</span>${extra}</span>
   ${wheel(r)}</button>`;
}
const bubble = (k,sm) => `<button class="bub${sm?" sm":""}" data-mix="${k}" aria-pressed="${mix.has(k)}"><span class="o" style="border-color:${GRPHEX[Z[k].grp]}">${icon(k,sm?36:44)}</span>${esc(Z[k].n)}</button>`;

function mixResults(){
  if(!mix.size) return [];
  return mixMode==="nur" ? R.filter(r=>Object.keys(r.z).every(k=>mix.has(k)))
                         : R.filter(r=>[...mix].every(k=>k in r.z));

function vSaefte(){

function weekStrip(){
  const now=new Date(); const mon=new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate()-((now.getDay()+6)%7));
  return `<div class="week">${["Mo","Di","Mi","Do","Fr","Sa","So"].map((l,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i);
    const n=log.filter(e=>new Date(e.t).toDateString()===d.toDateString()).length;
    return `<div class="${n?"on":""} ${d.toDateString()===now.toDateString()?"today":""}">${l}<i></i></div>`; }).join("")}</div>`;
}
function streak(){ let s=0; const d=new Date(); d.setHours(0,0,0,0);
  const days=new Set(log.map(e=>{const x=new Date(e.t); x.setHours(0,0,0,0); return x.getTime();}));
  if(!days.has(d.getTime())) d.setDate(d.getDate()-1);
  while(days.has(d.getTime())){ s++; d.setDate(d.getDate()-1); } return s; }
function vProgramme(){
  const wk=new Date(); wk.setDate(wk.getDate()-7);
  const last7=log.filter(e=>new Date(e.t)>wk);
  const ml=last7.reduce((a,e)=>{const r=byId(e.id); return a+(r?yieldMl(r):0);},0);
  const recent=[...log].sort((a,b)=>b.t-a.t).slice(0,8);
  return `<div class="wrap gut"><div class="section-head"><span>Dein Verlauf</span><small>diese Woche</small></div>
   <div class="stats"><div class="stat"><b>${last7.length}</b><span>Säfte, 7 Tage</span></div><div class="stat"><b>${streak()}</b><span>Tage in Folge</span></div><div class="stat"><b>${(ml/1000).toFixed(1).replace(".",",")}</b><span>Liter, 7 Tage</span></div></div>
   ${weekStrip()}
   ${recent.length?`<div class="section-head"><span>Zuletzt getrunken</span></div><div class="plain">${recent.map(e=>{const r=byId(e.id); if(!r) return ""; const d=new Date(e.t);
     return `<div class="li"><button data-open="${r.id}" style="background:none;border:0;padding:0;text-align:left;flex:1"><span class="n">${esc(r.n)}</span><span class="desc" style="font-size:.8rem;color:var(--muted)">${d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})}, ${d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}</span></button><button class="c" data-unlog="${e.t}" aria-label="Eintrag entfernen">Entfernen</button></div>`;}).join("")}</div>`
     :`<div class="empty" style="margin-top:8px">Im Rezept auf „Getrunken" tippen, dann erscheint der Saft hier.</div>`}
   <div class="section-head"><span>Programme</span><small>${PROGRAMME.length} Pläne</small></div>
   <div class="plain">${PROGRAMME.map(p=>`<button data-prog="${p.id}"><span class="n">${p.n}<span class="desc">${p.desc}</span></span><span class="c">${p.days.length} Tage</span></button>`).join("")}</div>
   <p class="foot">Die Programme sind Anregungen für Abwechslung, keine Kur und kein Ersatz für Mahlzeiten.</p></div>`;
}
function vWissen(){
  return `<div class="wrap gut"><div class="section-head"><span>Zutaten</span><small>${Object.keys(Z).length} Stück</small></div>
  ${CATS.map(([c,l])=>`<div class="label" style="margin:12px 2px 6px">${l}</div><div class="plain">${Object.entries(Z).filter(([,z])=>z.cat===c).sort((a,b)=>bySort(a[0],b[0])).map(([k,z])=>{
    const n=R.filter(r=>k in r.z).length;
    return `<details class="z"><summary><span class="o" style="width:42px;height:42px;border-radius:50%;border:3px solid ${GRPHEX[z.grp]};display:flex;align-items:center;justify-content:center;background:#fff">${icon(k,34)}</span>
      <span><span class="zn">${z.n}</span><br><span class="zs">ca. ${z.y} ml Saft je 100 g · ~${z.kc} kcal je 100 ml</span></span><span class="c">${n} Rez.</span></summary>
      <div class="zb"><div><b>Im Slow Juicer:</b> ${esc(z.tip)}</div><div><b>Lagerung:</b> ${esc(z.l)}</div><div><b>Wissenswert:</b> ${esc(z.w)}</div>
      ${n?`<div class="btnrow"><button class="btn2" data-withz="${k}">${n} Rezepte mit ${esc(z.n)}</button></div>`:""}</div></details>`; }).join("")}</div>`).join("")}
  <p class="foot">Ausbeute und Kalorien sind Richtwerte. Kalibrieren lohnt sich: einmal wiegen, einmal messen.</p></div>`;
}

// ---- Seiten im Stapel ----
const ORDER = {tomate:1,wassermelone:1,orange:2,grapefruit:2,zitrone:2,limette:2,granatapfel:2,gurke:3,zucchini:3,romana:3,minze:4,basilikum:4,petersilie:4,spinat:4,mangold:4,birne:5,fenchel:5,paprika:5,sellerie:6,kohlrabi:6,apfel:7,karotte:7,rote_bete:7,suesskartoffel:7,ingwer:7,kurkuma:7};
function steps(r){
  const ks=Object.keys(r.z).sort((a,b)=>ORDER[a]-ORDER[b]);
  const soft=ks.filter(k=>ORDER[k]<=3), leaf=ks.filter(k=>ORDER[k]===4), hard=ks.filter(k=>ORDER[k]>=5);
  const s=["Alles waschen und wie unten beschrieben schneiden. Kleine Stücke laufen gleichmäßiger."];
  if(soft.length) s.push(`Weiche, saftige Zutaten zuerst: ${soft.map(k=>Z[k].n).join(", ")}.`);
  if(leaf.length&&hard.length) s.push(`${leaf.map(k=>Z[k].n).join(", ")} gerollt und abwechselnd mit ${Z[hard[0]].n} einfüllen.`);
  else if(leaf.length) s.push(`${leaf.map(k=>Z[k].n).join(", ")} gerollt zwischen die übrigen Stücke geben.`);
  if(hard.length) s.push(`Feste Zutaten zum Schluss: ${hard.map(k=>Z[k].n).join(", ")}. Sie schieben Reste aus der Kammer.`);
  s.push(r.x||"Umrühren und frisch trinken. Im Kühlschrank in einer randvollen, verschlossenen Flasche höchstens 24 Stunden.");
  s.push("Sieb und Schnecke sofort ausspülen, bevor Fasern antrocknen.");
  return s;
}
function pRecipe(r){
  const ing=Object.entries(r.z).sort((a,b)=>b[1]-a[1]);
  const drunkToday=log.some(e=>e.id===r.id&&new Date(e.t).toDateString()===new Date().toDateString());
  const notes=[];
  if("grapefruit" in r.z) notes.push("Grapefruit hemmt den Abbau vieler Medikamente (u. a. bestimmte Statine, Blutdrucksenker, Immunsuppressiva). Bei Dauermedikation vorher Beipackzettel oder Apotheke prüfen.");
  if(r.z.spinat||r.z.mangold||(r.z.rote_bete||0)>=120) notes.push("Oxalatreich (Spinat, Mangold, Rote Bete). Bei Neigung zu Nierensteinen nicht täglich in großen Mengen.");
  if(r.wo) notes.push("Walker gibt Saftmengen an, nicht Rohgewicht. Umgerechnet mit den Ausbeute-Richtwerten dieser App, daher Schätzung. Walkers Gesundheitsversprechen sind wissenschaftlich nicht belegt.");
  else if(r.w) notes.push("Walker-Stil: Karotte als Basis, wenige Zutaten, kein Obst. Walkers Gesundheitsversprechen sind wissenschaftlich nicht belegt.");
  if(r.id==="w-nr2") notes.push("Die Petersilie entspricht etwa 2 Bund. Walker selbst rät, Petersiliensaft nicht pur in Mengen über 30–60 g zu trinken; hier ist er verdünnt. Bei Bedarf Petersilie halbieren.");
  const ziele=ZIELE.filter(z=>z.test(r));
  return `<div class="dhero">${jar(juiceColor(r),190)}<span class="bits">${ing.slice(0,4).map(([k])=>`<span class="ico" title="${esc(Z[k].n)}">${icon(k,40)}</span>`).join("")}</span></div>
  <section class="dband"><div class="wrap"><h2>${esc(r.n)}</h2>
   <div class="meta"><span>${ing.length} Zutaten</span><span>~${kcal(r,glasses)} kcal</span><span>~${yieldMl(r,glasses)} ml</span><span>${vegShare(r)} % Gemüse</span></div>
   <p>${esc(r.d)}</p>${r.h?`<p style="font-size:.85rem;opacity:.9;margin-top:6px">Herkunft: ${esc(r.h)}</p>`:""}
   <div class="acts"><button class="ghost" data-fav aria-pressed="${favs.has(r.id)}"><svg class="h" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Favorit</button>
   <button class="ghost" data-drunk aria-pressed="${drunkToday}"><svg viewBox="0 0 24 24"><path d="M5 12l4.5 4.5L19 7"/></svg>Getrunken</button></div></div></section>
  <div class="wrap">
  <section class="block"><h3>Zutaten <span class="stepper"><button data-g="-1" aria-label="Weniger">−</button><span>${glasses} ${r.shot?"Ansatz":(glasses===1?"Glas":"Gläser")}</span><button data-g="1" aria-label="Mehr">+</button></span></h3>
   <div class="ingwrap"><div class="pills">${ing.map(([k,g])=>`<div class="ipill${Z[k].grp==="wh"||Z[k].grp==="ye"?" light":""}" style="background:${GRPHEX[Z[k].grp]}"><span class="pn"><span class="pic">${icon(k,22)}</span>${esc(Z[k].n)}${r.opt&&r.opt.includes(k)?" (optional)":""}</span><span class="g">${fmtG(g*glasses)}${pieces(k,g*glasses)?" · "+pieces(k,g*glasses):""}</span></div>`).join("")}</div>${wheel(r,96)}</div>
   <ul class="tips">${ing.map(([k])=>`<li><b>${esc(Z[k].n)}:</b> ${esc(Z[k].tip)}</li>`).join("")}</ul></section>
  <section class="block"><h3>Zubereitung im Slow Juicer</h3><ol class="steps">${steps(r).map(s=>`<li>${esc(s)}</li>`).join("")}</ol></section>
  ${ziele.length?`<section class="block"><h3>Passt zu</h3><div class="plain">${ziele.map(z=>`<button data-ziel="${z.id}"><span class="n">${z.n}</span><span class="ev ${z.ev}">${z.evt}</span></button>`).join("")}</div></section>`:""}
  ${notes.length?`<section class="block">${notes.map(n=>`<p class="note">${esc(n)}</p>`).join("")}</section>`:""}
  </div>`;
}
function fruitToggle(){ return `<button class="switch" data-nofruit aria-pressed="${noFruit}"><span class="knob"></span><span><b>Ohne süßes Obst</b><span class="desc">blendet Rezepte mit Apfel, Birne, Orange, Grapefruit, Melone oder Granatapfel aus</span></span></button>`; }
function pList(p){ const all=p.ids; const ids=all.filter(id=>vis(byId(id))); const hid=all.length-ids.length; p={...p,ids};
  return `<div class="wrap gut"><div class="section-head"><span>${esc(p.head||"")}</span><small>${ids.length} Rezepte</small></div>
  ${hid?`<p class="foot" style="padding:0 2px 8px">${hid} ${hid===1?"Rezept":"Rezepte"} mit süßem Obst ausgeblendet. <button class="linkbtn" data-nofruit>Einblenden</button></p>`:""}
  ${p.info?`<p class="note" style="margin:0 0 10px">${esc(p.info)}</p>`:""}
  ${p.ids.length?`<div class="list">${p.ids.map(id=>row(byId(id))).join("")}</div>`:`<div class="empty">${esc(p.empty||"Keine Rezepte.")}</div>`}</div>`; }
function pProg(p){ return `<div class="wrap gut"><p class="note" style="margin-top:12px">${esc(p.desc)}</p>
  ${p.days.map((d,i)=>`<div class="section-head"><span>Tag ${i+1}</span></div><div class="list">${d.map(id=>row(byId(id))).join("")}</div>`).join("")}</div>`; }

// ===================== Rendering & Routing =====================
const VIEWS={start:["Saftpresse",vStart],saefte:["Rezepte",vSaefte],programme:["Programme",vProgramme],wissen:["Wissen",vWissen]};
const cur = () => { const h=location.hash.slice(1); return VIEWS[h]?h:"start"; };
function render(keepScroll){
  const v=cur(), top=stack[stack.length-1];
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===v?"page":"false"));
  const back=document.getElementById("backSlot"), title=document.getElementById("title"), main=document.getElementById("main");
  if(top){
    back.innerHTML=`<button class="back" data-back><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7M8 12h12"/></svg>ZURÜCK</button>`;
    if(top.type==="recipe"){ title.textContent="Rezepte"; main.innerHTML=pRecipe(byId(top.id)); }
    else if(top.type==="prog"){ const p=PROGRAMME.find(x=>x.id===top.id); title.textContent=p.n; main.innerHTML=pProg(p); }
    else { title.textContent=top.title; main.innerHTML=pList(top); }
  } else {
    back.innerHTML=""; title.innerHTML = v==="start" ? `<span class="logo">saft<span>presse</span></span>` : VIEWS[v][0];
    main.innerHTML=VIEWS[v][1]();
  }
  if(!keepScroll) window.scrollTo(0,0);
}
function push(p){ if(p.type==="recipe") glasses=1; stack.push(p); render(); }
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>el.hidden=true,1800); }

document.addEventListener("click",e=>{
  const t=e.target.closest("button,a[data-v]"); if(!t) return; const d=t.dataset;
  if(t.matches("nav.tabs a")){ stack=[]; if(location.hash==="#"+d.v){ e.preventDefault(); render(); } return; }
  if("back" in d){ stack.pop(); render(); return; }
  if(d.open){ push({type:"recipe",id:d.open}); return; }
  if(d.sub){ sub=d.sub; render(); return; }
  if(d.mix){ mix.has(d.mix)?mix.delete(d.mix):mix.add(d.mix); save(); const y=window.scrollY; render(true); window.scrollTo(0,y); return; }
  if(d.mode){ mixMode=d.mode; save(); render(true); return; }
  if("clearmix" in d){ mix.clear(); save(); render(true); return; }
  if("showmix" in d){ const res=mixResults(); push({type:"list",title:"Mixer",head:[...mix].map(k=>Z[k].n).join(" + "),ids:res.sort((a,b)=>vegShare(b)-vegShare(a)).map(r=>r.id)}); return; }
  if(d.coll){ const s=SAMMLUNGEN.find(x=>x.id===d.coll); push({type:"list",title:"Rezepte",head:s.n,empty:s.id==="fav"?"Noch keine Favoriten. Im Rezept auf „Favorit“ tippen.":"",ids:R.filter(s.f).sort((a,b)=>vegShare(b)-vegShare(a)).map(r=>r.id)}); return; }
  if("nofruit" in d){ noFruit=!noFruit; save(); render(true); toast(noFruit?"Rezepte mit süßem Obst ausgeblendet":"Alle Rezepte sichtbar"); return; }
  if(d.ziel){ const z=ZIELE.find(x=>x.id===d.ziel); push({type:"list",title:"Gesundheit",head:z.n,info:z.info,ids:R.filter(z.test).sort((a,b)=>vegShare(b)-vegShare(a)).map(r=>r.id)}); return; }
  if(d.withz){ push({type:"list",title:"Wissen",head:"Mit "+Z[d.withz].n,ids:R.filter(r=>d.withz in r.z).map(r=>r.id)}); return; }
  if(d.prog){ push({type:"prog",id:d.prog}); return; }
  const top=stack[stack.length-1], r=top&&top.type==="recipe"?byId(top.id):null;
  if(d.g&&r){ glasses=Math.min(6,Math.max(1,glasses+Number(d.g))); render(true); return; }
  if("fav" in d&&r){ favs.has(r.id)?favs.delete(r.id):favs.add(r.id); save(); render(true); toast(favs.has(r.id)?"Favorit gespeichert":"Favorit entfernt"); return; }
  if("drunk" in d&&r){ for(let i=0;i<glasses;i++) log.push({id:r.id,t:Date.now()+i}); save(); render(true); toast(glasses>1?`${glasses} Gläser eingetragen`:"Als getrunken eingetragen"); return; }
  if(d.unlog){ log=log.filter(x=>String(x.t)!==d.unlog); save(); render(true); return; }
});
window.addEventListener("hashchange",()=>{ stack=[]; render(); });
render();
</script>

<script>
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
